seo:
  title: ShopBite – Demo Store
  description: Dein eigenes Bestellsystem ohne Provisionen, ohne monatliche Kosten – 100% Open Source und individuell anpassbar. Perfekt für Pizzerien, Imbisse und Lieferdienste.
  image: /card.png
title: ShopBite
description: Reduziere Kosten und steigere deinen Umsatz
hero:
  backgroundVideo: https://veliu-minio.cjcbee.easypanel.host/shopbite-demo-shopware/media/f8/66/7e/1789150226/background.mp4?ts=1789150226
  poster: /hero-poster.webp
  headline: SHOPBITE
  usps:
    - title: 4.5 ⭐
      subtitle: 720+ Reviews
      icon: i-simple-icons-google
      link: https://www.google.com/maps/place/?q=place_id
    - title: 20 Jahre
      subtitle: in Obertshausen
      icon: i-lucide-award
    - title: Lieferservice
      subtitle: Schnell & zuverlässig
      icon: i-lucide-bike
  links:
    - label: Speisekarte
      icon: i-lucide-arrow-right
      trailing: true
      color: primary
      to: /speisekarte/
      size: xl
    - label: Tisch reservieren
      icon: i-lucide-phone
      size: xl
      color: neutral
      variant: outline
      to: "tel:+490610477777"
