mittagstisch:
  headline: SHOPBITE
  title: Mittagstisch
  description: Jetzt auch Samstags!
  reverse: true
  orientation: horizontal
  image: https://veliu-minio.cjcbee.easypanel.host/shopbite-demo-shopware/media/50/31/b1/1789148669/restaurant4.webp?ts=1789148669
  imageAlt: Illustration
  features:
    - title: Montag bis Samstag
      description: 11:30 bis 15:00 Uhr
      icon: i-lucide-clock
    - title: Täglich wechselndes Angebot
      description: 3 verschieden Speisen ab 9,90 €
      icon: i-lucide-utensils-crossed
    - title: Wichtiger Hinweis
      description: An Feiertagen bieten wir keinen Mittagstisch an. Wir bitten um Ihr Verständnis und freuen uns, Sie an regulären Werktagen zur Mittagszeit begrüßen zu dürfen.
      icon: i-lucide-info
  links:
    - label: Reservieren
      to: "tel:+49610471427"
      color: neutral
      variant: subtle
      trailingIcon: i-lucide-phone
