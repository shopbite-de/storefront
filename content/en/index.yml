faq:
  headline: SHOPBITE
  title: Frequently asked questions
  items:
    - question: Where do you deliver?
      answer: We deliver to 12345 Sampletown (Sampletown and Nearby) and to 12346 Example Village.
    - question: How much is delivery?
      answer: Delivery is free for orders of €15 or more. Below that we charge a delivery fee of €2.
    - question: How long does delivery take?
      answer: About 30 minutes. You can also choose a later delivery time when you order.
    - question: Can I pick up my order?
      answer: Yes, you can also pick up your order from us at 1 Sample Street in Sampletown.
    - question: How can I pay?
      answer: In cash on delivery, in cash or by debit card on pickup.
    - question: Do you have vegetarian and vegan dishes?
      answer: Yes, vegetarian and vegan dishes are marked on the menu.
    - question: Can I book a table?
      answer: We take table bookings by phone only.
