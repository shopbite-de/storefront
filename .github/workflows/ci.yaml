name: CI
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    types: [opened, synchronize]

env:
  NUXT_PUBLIC_APP_ENV: 'test'
  NUXT_PUBLIC_STORE_URL: 'http://localhost:3005'
  PORT: '3005'
  # private runtime config since 3.0 (the secrets keep their 2.x names)
  NUXT_SHOPWARE_ENDPOINT: ${{ secrets.NUXT_PUBLIC_SHOPWARE_ENDPOINT }}
  NUXT_SHOPWARE_ACCESS_TOKEN: ${{ secrets.NUXT_PUBLIC_SHOPWARE_ACCESS_TOKEN }}
  # seals the session cookie of the built storefront (a11y job); a test value
  NUXT_VISITOR_SESSION_PASSWORD: 'ci-only-session-password-0123456789abcdef'
  NUXT_PUBLIC_SITE_COUNTRY_ID: ${{ secrets.NUXT_PUBLIC_SITE_COUNTRY_ID }}
  GEOPIFY: ${{ secrets.GEOPIFY }}

jobs:
  setup:
    name: Install & Build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Rebuild native modules
        run: pnpm rebuild better-sqlite3

      - name: Build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: pnpm run build

      # the behaviour tests' seam (modules/test-seams.ts) exists only in
      # builds made with SHOPBITE_TEST_SEAMS=1, never in this one
      - name: No test seams in the production build
        run: |
          if grep -rqs "/api/_test/" .output/server; then
            echo "::error::The production build contains the test seams (/api/_test/)"
            exit 1
          fi

      - name: Save workspace to cache
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            .nuxt
            .output
          key: workspace-${{ runner.os }}-${{ github.sha }}

  lint:
    name: Lint & format
    environment: test
    needs: [setup]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Restore workspace from cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            .nuxt
            .output
          key: workspace-${{ runner.os }}-${{ github.sha }}

      - name: Prettier
        run: pnpm prettier

      - name: ESLint
        run: pnpm eslint

      - name: Typecheck
        run: pnpm typecheck

  unit-test:
    name: Unit tests
    environment: test
    needs: [setup]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Restore workspace from cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            .nuxt
            .output
          key: workspace-${{ runner.os }}-${{ github.sha }}

      - name: Unit tests
        run: pnpm test:unit

  layer-build:
    name: Build as a layer
    needs: [setup]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Restore workspace from cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            .nuxt
            .output
          key: workspace-${{ runner.os }}-${{ github.sha }}

      # test/layer extends the storefront like a shop does; imports that only
      # resolve inside the storefront itself break here (2.0.1)
      - name: Build test/layer
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: pnpm nuxt build test/layer

      # ADR 0002: the shop's overridden German message, then its own locale
      # (Dutch, English fallback, its own paths)
      - name: Check test/layer in German
        run: test/layer/check-locale.sh de

      - name: Build test/layer in its own locale
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          NUXT_SHOPBITE_LOCALE: nl
        run: pnpm nuxt build test/layer

      - name: Check test/layer in its own locale
        run: test/layer/check-locale.sh nl

  a11y:
    name: Accessibility (${{ matrix.preset }})
    # no test customer needed: the repository secrets (Store API key) suffice
    needs: [setup]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [trattoria, grill, asia]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Restore workspace from cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            .nuxt
            .output
          key: workspace-${{ runner.os }}-${{ github.sha }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts .output/server/index.mjs (webServer)
      # one build serves every preset, chosen at runtime
      - name: axe checks
        env:
          NUXT_PUBLIC_SHOP_BITE_THEME_PRESET: ${{ matrix.preset }}
        run: pnpm test:a11y --reporter=list,html

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: a11y-report-${{ matrix.preset }}
          path: playwright-report/
          retention-days: 14

  e2e-test:
    name: Behaviour tests (memory)
    # the Gherkin features of test/bdd against the in-memory backend: no
    # Shopware, no secrets (the Shopware run: bdd-shopware.yaml)
    needs: [setup]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Restore workspace from cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            .nuxt
            .output
          key: workspace-${{ runner.os }}-${{ github.sha }}

      # a build of its own with the scenario seam; the cached production
      # build stays without it
      - name: Build with test seams
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          SHOPBITE_TEST_SEAMS: '1'
        run: pnpm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts .output/server/index.mjs (webServer)
      - name: Behaviour tests
        run: pnpm test:bdd --reporter=list,html

      # the same German build: no message key, no unfilled placeholder,
      # messages without request or compiler (ADR 0002, test/i18n)
      - name: German messages
        run: pnpm test:i18n:de --reporter=list

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bdd-memory-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  english:
    name: English shop (memory)
    # ADR 0002: an English build shows no German and English paths; the
    # main flows of test/i18n on the memory backend
    needs: [setup]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Restore workspace from cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            .nuxt
            .output
          key: workspace-${{ runner.os }}-${{ github.sha }}

      - name: Build in English with test seams
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          NUXT_SHOPBITE_LOCALE: en
          SHOPBITE_TEST_SEAMS: '1'
        run: pnpm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: English flows
        run: pnpm test:i18n:en --reporter=list,html

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: english-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
